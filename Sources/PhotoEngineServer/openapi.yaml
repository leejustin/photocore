openapi: 3.0.3
info:
  title: Photocore
  version: "2.0.0"
  description: |
    Local curation API and the server behind Bound, the consumer app. Bind is
    127.0.0.1 only. Every route requires Authorization: Bearer with the server
    token except GET /healthz, GET /new and the routes under /b/ (books), /j/
    (invites), /u/ (unsubscribe), /p/ (print files), /w/ (web owners),
    /checkout/ (test checkout), /stripe/ (signed webhook) and /.well-known/.
    Book edits and /w/trips need the book's own owner token; invite routes
    that act for a person need their contributor token in
    X-Photocore-Contributor. Clients never choose an output path.
servers:
  - url: http://127.0.0.1:8787
paths:
  /healthz:
    get:
      summary: Liveness
      security: []
      responses:
        "200":
          description: Process is up
  /v2/readyz:
    get:
      summary: Catalog, disk, and Vision checks
      responses:
        "200":
          description: Ready or not
  /v2/openapi.yaml:
    get:
      summary: This contract
      responses:
        "200":
          description: OpenAPI document
  /v2/sessions:
    get:
      summary: Paginated session list
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Session summaries
    post:
      summary: Start a curate job
      responses:
        "202":
          description: Job
  /v2/sessions/{sid}:
    get:
      summary: Session detail
      parameters:
        - $ref: "#/components/parameters/sid"
      responses:
        "200":
          description: Session detail
    delete:
      summary: Delete a run directory Photocore created, and its catalog rows
      parameters:
        - $ref: "#/components/parameters/sid"
      responses:
        "204":
          description: Deleted
  /v2/sessions/{sid}/photos:
    get:
      summary: Photos in a set
      parameters:
        - $ref: "#/components/parameters/sid"
        - name: set
          in: query
          schema:
            type: string
            enum: [album, alternates, needsLook, hidden, unusable, all]
      responses:
        "200":
          description: Photo page
  /v2/sessions/{sid}/photos/{pid}:
    patch:
      summary: Update a mark, bucket, or recipe
      parameters:
        - $ref: "#/components/parameters/sid"
        - $ref: "#/components/parameters/pid"
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated photo
        "412":
          description: precondition_failed
  /v2/sessions/{sid}/groups:
    get:
      responses:
        "200":
          description: Groups
  /v2/sessions/{sid}/confirmations:
    get:
      responses:
        "200":
          description: Confirmation queue
  /v2/sessions/{sid}/confirmations/{mid}/resolve:
    post:
      responses:
        "200":
          description: Updated confirmation queue
  /v2/sessions/{sid}/look:
    get:
      responses:
        "200":
          description: Look settings
    put:
      responses:
        "200":
          description: Stored look settings
  /v2/sessions/{sid}/deliveries:
    post:
      responses:
        "202":
          description: Deliver job
  /v2/sessions/{sid}/deliveries/{jid}/files:
    get:
      responses:
        "200":
          description: Delivered files
  /v2/media/{sid}/{pid}/thumb:
    get:
      responses:
        "200":
          description: JPEG thumbnail
        "304":
          description: Not modified
  /v2/media/{sid}/{pid}/preview:
    get:
      parameters:
        - name: size
          in: query
          schema: { type: integer, default: 1600 }
      responses:
        "200":
          description: Rendered JPEG
        "304":
          description: Not modified
  /v2/media/{sid}/deliveries/{jid}/{file}:
    get:
      responses:
        "200":
          description: Delivered JPEG
        "206":
          description: Range
  /v2/looks:
    get:
      responses:
        "200":
          description: Built-in and imported looks
    post:
      responses:
        "201":
          description: Imported look
  /v2/jobs:
    get:
      responses:
        "200":
          description: Jobs
  /v2/jobs/{jid}:
    get:
      responses:
        "200":
          description: Job
  /v2/jobs/{jid}/cancel:
    post:
      responses:
        "202":
          description: Job
  /v2/jobs/{jid}/events:
    get:
      responses:
        "200":
          description: text/event-stream
  /v2/trips:
    post:
      summary: "Start a trip {title?, note?, calendarEvents?, tone?, theme?, ownerName?}. Returns the owner token once."
      responses:
        "201":
          description: "{id, slug, ownerToken, bookPath, editPath, invitePath}"
  /v2/trips/{tid}:
    get:
      summary: Trip status, photo counts, contributors and the last finish job
      responses:
        "200":
          description: "Trip, with invitePath, inviteOpen and contributors [{name, photos}]"
  /v2/trips/{tid}/plan:
    post:
      summary: "Apply a StoreKit 2 signed transaction {transaction}: Plus, a Trip Pass or an Event Pass. Checked against Apple Root CA G3."
      responses:
        "200":
          description: "{plan, limits, hostedUntil, subscriptionExpires}"
        "400":
          description: Forged, foreign or unknown purchase
        "402":
          description: Subscription ended, or Plus's 12 books this year are used
        "409":
          description: The pass was spent on another book
  /v2/trips/{tid}/print.pdf:
    get:
      summary: The finished book as a print-ready PDF (8 x 8 inch pages with 0.125 inch bleed)
      responses:
        "200":
          description: application/pdf
  /v2/trips/{tid}/settings:
    post:
      summary: "Change {title?, note?, calendarEvents?, tone?, theme?, ownerName?} before a finish"
      responses:
        "200":
          description: "{ok}"
  /v2/trips/{tid}/invite:
    post:
      summary: "Open or close the invite link {open}. Photos already added stay."
      responses:
        "200":
          description: "{open}"
  /v2/trips/{tid}/photos/{name}:
    put:
      summary: Upload one keeper (JPEG or HEIC body, 60 MB max, 400 per trip)
      responses:
        "201":
          description: Stored
  /v2/trips/{tid}/finish:
    post:
      summary: Queue the finish (cull each person's photos, keep the best shot of each moment, facts, diary, photos, page, Instagram pack)
      responses:
        "202":
          description: Job
        "412":
          description: No photos from anyone yet
  /v2/preview:
    post:
      summary: Render one photo with the paid finish, for the upsell preview
      responses:
        "200":
          description: image/jpeg
  /b/{slug}/:
    get:
      summary: The shared book page (public by link)
      security: []
      responses:
        "200":
          description: text/html
  /b/{slug}/edits:
    post:
      summary: "Owner edit {key, value}; Authorization: Bearer <owner token>"
      security: []
      responses:
        "200":
          description: Applied
  /b/{slug}/guest:
    get:
      summary: Guest notes and hearts
      security: []
      responses:
        "200":
          description: "{notes, hearts}"
  /b/{slug}/guest/notes:
    post:
      summary: "Add a guest note {name, text}"
      security: []
      responses:
        "201":
          description: Updated activity
  /b/{slug}/guest/hearts:
    post:
      summary: "Heart a photo {photo}"
      security: []
      responses:
        "200":
          description: Updated activity
  /b/{slug}/print-interest:
    post:
      summary: Count a visitor who'd want a printed copy
      security: []
      responses:
        "200":
          description: "{count}"
  /j/{code}:
    get:
      summary: The invite page where people who were there add their photos
      security: []
      responses:
        "200":
          description: text/html
  /j/{code}/status:
    get:
      summary: Invite status; with X-Photocore-Contributor, also the person's name and photo count
      security: []
      responses:
        "200":
          description: "{title, open, people, photos, bookPath?, me?, mine?}"
  /j/{code}/join:
    post:
      summary: "Join the trip {name}. Returns the contributor token once (50 people per trip)."
      security: []
      responses:
        "201":
          description: "{name, token}"
        "403":
          description: The owner closed the invite
  /j/{code}/photos/{name}:
    put:
      summary: "Add one photo (JPEG or HEIC; 150 per person, 1,000 per trip); X-Photocore-Contributor required"
      security: []
      responses:
        "201":
          description: Stored
  /j/{code}/photos:
    delete:
      summary: Remove every photo this person added; X-Photocore-Contributor required
      security: []
      responses:
        "200":
          description: "{removed}"
  /v2/trips/{tid}/device:
    post:
      summary: Register the owner's iPhone (APNs token) for "Day 2 is in"
      responses:
        "200": { description: Registered }
        "400": { description: Not a device token }
  /v2/metrics/growth:
    get:
      summary: '"Make one for your trip" taps by month and platform'
      responses:
        "200": { description: Counts }
  /v2/admin/lifecycle:
    post:
      summary: Run reminders, purges, the nightly refinish and print follow-up now
      responses:
        "200": { description: What ran }
  /v2/admin/orders:
    get:
      summary: Every print order
      responses:
        "200": { description: Orders }
  /b/{slug}/make:
    get:
      summary: '"Make one for your trip": counts the platform, redirects to the App Store or /new'
      security: []
      responses:
        "302": { description: Redirect }
  /b/{slug}/keep:
    post:
      summary: Start a checkout to keep a free book for good (anyone with the link)
      security: []
      responses:
        "200": { description: "{url, id} of the checkout" }
        "409": { description: Already kept }
        "410": { description: Photos already deleted }
        "503": { description: Payments aren't set up }
  /b/{slug}/print:
    post:
      summary: Start a checkout for a printed copy (softcover or hardcover), shipped
      security: []
      responses:
        "200": { description: "{url, id} of the checkout" }
  /b/{slug}/thanks:
    get:
      summary: Thank-you page after a checkout
      security: []
      responses:
        "200": { description: Page }
  /b/{slug}/photos.zip:
    get:
      summary: Everyone's full-size photos in a kept book
      security: []
      responses:
        "200": { description: Zip }
        "402": { description: Comes with keeping the book }
  /j/{code}/email:
    post:
      summary: Add, change or clear the person's email
      security: []
      responses:
        "200": { description: Saved }
  /j/{code}/offers:
    post:
      summary: The App Clip's offers (feature print, time, score per pick); answers with the originals wanted
      security: []
      responses:
        "200": { description: "{wanted, uploaded, offered}" }
  /j/{code}/wanted:
    get:
      summary: Originals the book still wants from this person
      security: []
      responses:
        "200": { description: "{wanted, uploaded, offered}" }
  /j/{code}/you:
    get:
      summary: Photos of you, faces to tap and the photos found
      security: []
      responses:
        "200": { description: Faces, taps and photos }
    post:
      summary: Tap or untap a face as yours
      security: []
      responses:
        "200": { description: Updated }
  /j/{code}/you/not:
    post:
      summary: Say you're not in a photo, or undo it
      security: []
      responses:
        "200": { description: Updated }
  /j/{code}/you.zip:
    get:
      summary: The book's photos of you
      security: []
      responses:
        "200": { description: Zip }
  /j/{code}/faces/{file}:
    get:
      summary: One face crop for the picker
      security: []
      responses:
        "200": { description: JPEG }
  /u/{token}:
    get:
      summary: Unsubscribe page
      security: []
      responses:
        "200": { description: Page }
    post:
      summary: Stop emails about this book (one click)
      security: []
      responses:
        "200": { description: Done }
  /p/{token}/{name}:
    get:
      summary: Interior or cover PDF for the printer
      security: []
      responses:
        "200": { description: PDF }
  /stripe/webhook:
    post:
      summary: Stripe's signed webhook; paid checkouts keep books, add Event Passes or order prints
      security: []
      responses:
        "200": { description: Received }
        "400": { description: Bad signature }
  /checkout/dev/{id}:
    get:
      summary: The no-charge test checkout (PHOTOCORE_DEV_CHECKOUT=1)
      security: []
      responses:
        "200": { description: Page }
  /new:
    get:
      summary: Start a book on the web
      security: []
      responses:
        "200": { description: Page }
  /w/trips:
    post:
      summary: Create a web book; returns the owner token once. Ten an hour per address
      security: []
      responses:
        "201": { description: "{id, ownerToken, ownerPath}" }
  /w/{id}:
    get:
      summary: The web owner's private page
      security: []
      responses:
        "200": { description: Page }
  /w/trips/{id}:
    get:
      summary: Web book status (owner token)
      security: []
      responses:
        "200": { description: Status }
  /w/trips/{id}/photos/{name}:
    put:
      summary: Add an owner photo (owner token); culled on the server at finish
      security: []
      responses:
        "201": { description: Stored }
  /w/trips/{id}/finish:
    post:
      summary: Make the book (owner token)
      security: []
      responses:
        "202": { description: Queued }
  /w/trips/{id}/event:
    post:
      summary: Checkout for the Event Pass (owner token)
      security: []
      responses:
        "200": { description: "{url, id}" }
  /.well-known/apple-app-site-association:
    get:
      summary: App Clip and universal links (when PHOTOCORE_APPLE_TEAM_ID is set)
      security: []
      responses:
        "200": { description: JSON }
components:
  parameters:
    sid:
      name: sid
      in: path
      required: true
      schema: { type: string }
    pid:
      name: pid
      in: path
      required: true
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 50 }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
security:
  - bearer: []
